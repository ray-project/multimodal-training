debug: false

vision:
  model_type: "qwen3_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "flash_attention_2"
  activation_checkpointing: true
  autocast: true
  engine_config:
    tensor_parallel_size: 4
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    attention_backend: "unfused"

text:
  model_type: "qwen3_vl"
  model_name: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  engine: "megatron"
  parallelism: "tensor"
  dtype: "bfloat16"
  attention_backend: "flash_attention_2"
  activation_checkpointing: true
  autocast: true
  engine_config:
    tensor_parallel_size: 4
    pipeline_model_parallel_size: 1
    sequence_parallel_size: 1
    attention_backend: "unfused"

training:
  batch_size: 1
  learning_rate: 5e-05
  num_epochs: 1
  num_iterations: 20
  warmup_steps: 0
  warmup_ratio: 0.0
  lr_scheduler_type: "constant"
  weight_decay: 0.0
  gradient_accumulation_steps: 1
  seed: 42
  parallel_size: 4
  dp_size: 1
  collocate: true
  clip_grad_norm: false
  max_grad_norm: 1.0
  no_checkpoint: true
  checkpoint_dir: "/mnt/local_storage/checkpoints/qwen3_vl_30b_a3b"
  log_interval: 1

data:
  datasets:
    - mscoco2017_train_captions
  data_registry:
    mscoco2017_train_captions:
      annotation_path: "/mnt/local_storage/mscoco2017/annotations/coco2017_train_qwen.json"
      data_path: "/mnt/local_storage/mscoco2017"
  num_workers: 2
  pin_memory: true
  data_flatten: true
  min_pixels: 802816
  max_pixels: 802816
  force_fixed_size: false

deepspeed:
  reduce_bucket_size: 100000000
